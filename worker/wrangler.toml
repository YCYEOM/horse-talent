# horse-talent 전역 순위 Worker.
#
# 게임은 GitHub Pages 의 정적 페이지라 서버가 없다 — 여러 사람이 나눠 보는 순위는
# 어딘가에 쌓여야 하고 그 어딘가가 여기다.
#
# 배포:  npx wrangler deploy
# 스키마: npx wrangler d1 execute horse-talent --remote --file=schema.sql
# 소금:  npx wrangler secret put IP_SALT   (없으면 기본값으로 돈다)

name = "horse-talent-rank"
main = "worker.js"
compatibility_date = "2026-08-07"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "horse-talent"
database_id = "87e29420-adcf-4702-be8a-db1797526966"
