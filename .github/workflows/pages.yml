# 플레이 가능한 빌드를 GitHub Pages 에 올린다.
#
# **검사를 통과한 것만 올린다.** 빌드만 돌리고 배포하면 깨진 게임이 올라간다 —
# 이 저장소는 검사가 코드의 74% 라 그걸 건너뛸 이유가 없다.
#
# `vite.config.ts` 의 `base: "./"` 가 하위 경로(`/horse-talent/`)를 처리한다.
# 저장소 이름을 여기 하드코딩하지 않는 이유다.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 손으로도 돌릴 수 있게

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩. 밀린 것은 버린다 — 중간 버전을 올릴 이유가 없다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test          # 통과 못 하면 여기서 멈춘다
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
