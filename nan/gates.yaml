# horse-talent 게이트.
#
# 두 종류가 섞여 있다. 섞인 이유를 먼저 읽어라.
#
#   hardGates      — **플랫폼 계약이다.** 키 7개가 고정이고 늘릴 수 없다
#                    (bass 의 concept 스키마가 `.strict()` 다). 이름을 못 바꾸므로
#                    **이 프로젝트에서 각 키가 무엇을 뜻하는지 아래에 다시 정의한다.**
#   projectGates   — 이 프로젝트가 스스로 건 게이트. 플랫폼은 안 본다.
#                    긴 판에서만 생기는 실패를 막는다. 사람과 에이전트가 본다.
#
# 이 프로젝트는 **한 판 10~20분** 게임이다(사용자 지정). nan(30초~2분)의 게이트를
# 그대로 쓰면 목표와 싸운다 — 아래 재정의가 그 조정이다.

milestones:
  - { id: M1, outcome: first-three-minutes, note: "첫 3분이 실제로 플레이된다. 이게 이 프로젝트의 세로 조각이다" }
  - { id: M2, outcome: full-arc, note: "한 판이 끝까지 간다. 10~20분이 실측으로 확인된다" }
  - { id: M3, outcome: curve-tuned, note: "후반이 초반의 반복이 아니다 — 곡선이 수치로 재현된다" }
  - { id: M4, outcome: feature-freeze, note: "새 시스템 금지. 이후는 값과 판독성만" }
  # 2026-08-06, HT-007 — **동결.** 시스템 2 · 승식 7 · 능력치 5 · 페이즈 6 ·
  # 경주 8~12 · 6두 · 거리 6종. `src/freeze.test.ts` 가 개수를 못 박는다.
  # 이후 변경은 **값과 표시만**. 규칙이 바뀌면 M4 위반이고 새 마일스톤이다.
  - { id: M5, outcome: shippable, note: "빌드·테스트·증거가 재현된다" }
  # 2026-08-07, HT-008 — **닫혔다.**
  #   · `npm run evidence` 한 명령으로 검사·빌드·격리·실측·라이선스·AI기록·화면.
  #     실패하면 멈추고 안 돈 단계를 REPORT 에 적는다.
  #   · 실측이 GAME_SPEC 의 수치를 다시 낸다 — 어긋남 0건.
  #   · 플레이 가능: https://ycyeom.github.io/horse-talent/ (검사 통과분만 배포)
  #   · 사람 판정 3문항 회신 완료. **M4 부터 열려 있던 것이 전부 닫혔다.**
  # 남은 것 — 한 판 실제 분 수(12R 고정 이후 미측정) · CI 는 실측/화면을 안 돌린다.

# ── 플랫폼 계약 7개 ─────────────────────────────────────────────────────────
# 키는 못 바꾼다. 뜻은 이 프로젝트 기준으로 읽는다(definitions 참조).
hardGates:
  - theme-is-mechanic
  - one-sentence-playable-loop
  - representative-scene
  - vertical-slice-in-six-hours
  - maximum-two-new-core-systems
  - visible-player-feedback
  - shippable-evidence

# 각 키가 **이 프로젝트에서** 무엇을 묻는가. nan 과 다른 곳에는 이유를 적었다.
definitions:
  theme-is-mechanic: >-
    주제를 빼면 규칙이 달라지는가. **nan 과 같다.** 이 게이트가 nan 에서 가장 많이
    걸러냈고(원안 총알피하기가 여기서 죽었다) 판 길이와 무관하게 유효하다.
  one-sentence-playable-loop: >-
    **핵심 루프**를 한 문장으로 설명할 수 있는가. nan 은 게임 전체가 한 문장이었지만
    10~20분 게임은 그럴 수 없다. 여기서 묻는 것은 **매 순간 반복되는 루프** 한 문장이다.
    게임 전체를 한 문장으로 요약하라는 뜻이 아니다.
  representative-scene: >-
    5초짜리 대표 장면을 설명할 수 있는가. **nan 과 같되 하나 더 묻는다** —
    그 장면이 **몇 분쯤에** 나오는가. 늘 1분에만 나오면 나머지 15분은 왜 있는가.
  vertical-slice-in-six-hours: >-
    **"첫 3분"이 6시간 안에 플레이 가능한가.** nan 은 게임 전체가 6시간이었다.
    긴 게임에서 그 잣대는 게임을 짧게 만들라는 압력일 뿐이라 **범위를 시간이 아니라
    게임의 앞부분으로 바꾼다.** 첫 3분이 안 서면 나머지도 안 선다.
  maximum-two-new-core-systems: >-
    신규 핵심 시스템 2개 이하. **플랫폼이 `newCoreSystems` 를 최대 2로 하드캡한다** —
    이건 못 늘린다. 긴 게임은 시스템을 늘려 길이를 만들고 싶어지는데, 그 유혹을
    플랫폼이 막아준다. **길이는 시스템 수가 아니라 상태 공간에서 나와야 한다.**
  visible-player-feedback: >-
    판정과 상태 변화가 화면에 보이는가. **nan 과 같다.**
  shippable-evidence: >-
    빌드·테스트·기록이 재현 가능한가. **nan 과 같다.**

# ── 이 프로젝트가 스스로 건 게이트 ───────────────────────────────────────────
# 전부 **긴 판에서만 생기는 실패**를 막는다. 하나라도 실패하면 컨셉을 폐기한다.
projectGates:
  - id: curve-not-repetition
    ask: "15분 지점이 3분 지점과 다른 게임인가."
    why: >-
      **이 프로젝트의 1번 위험이다.** 짧은 게임은 반복이어도 되지만 10~20분은
      후반이 초반의 반복이면 지루함이 아니라 **낭비**가 된다. nan 에는 이 게이트가
      없었다 — 30초짜리에 곡선이 필요 없었기 때문이다.
    fail_if: "난이도 숫자만 오르고 판단의 종류가 그대로다."
    status: satisfied
    # 2026-08-06, HT-005·HT-006 — **국면마다 최선의 수가 다른 범주다**(수치는 GAME_SPEC).
    #   초반   전 승식 −41% 이하 → **안 건다.** 강화에 넣고 상금으로 버틴다
    #   중반   내 말 단승 +96%   → **정보 레버리지**
    #   감소 시 인기마 단승 +45% → **역베팅** (평판이 정확하면 −29% — 우위는 오가격에서만)
    #   후반   상금 1,862 G ≫ 베팅 우위 → **강화 배분.** 같은 총 스탯도 382~3,939 G 로 갈린다
    # 처음 측정에서는 곡선이 없어 보였다(중반·후반 최선이 둘 다 "단승").
    # **역베팅과 후반 상금 배분을 안 쟀던 것**이 이유였다 — 값을 안 만지고 화면만 고쳤다.
    # 안정 스탯이 국면에 따라 값이 뒤집히는 것도 확인했다(강하면 이득 · 약하면 손해).

  - id: decisions-bind
    ask: "앞의 결정이 뒤를 묶는가 — 되돌릴 수 없는 선택이 있는가."
    why: >-
      긴 판이 의미가 있으려면 3분에 한 선택이 12분에 값을 치러야 한다.
      매 순간이 독립이면 그건 짧은 게임을 여러 번 하는 것이고, 그러면 짧게 만드는 게 낫다.
    fail_if: "어느 시점에 다시 시작해도 같은 상태로 수렴한다."

  - id: length-from-state-not-content
    ask: "길이가 **상태**에서 나오는가, **콘텐츠**에서 나오는가."
    why: >-
      스테이지·적 종류·아이템을 늘려 15분을 채우는 것은 대량 수작업 콘텐츠이고
      이 팀 규모에서 죽는 길이다. 같은 규칙이 상태에 따라 다른 판을 만들어야 한다.
      nan 의 7번 게이트(대량 콘텐츠 불필요)를 긴 게임 기준으로 다시 쓴 것이다.
    fail_if: "분량을 늘리려면 콘텐츠를 더 만들어야 한다."

  - id: quit-point-known
    ask: "사람이 그만두고 싶어지는 지점이 어디인지 말할 수 있는가."
    why: >-
      10~20분에는 반드시 늘어지는 구간이 있다. **모른다고 답하면 없는 게 아니라
      안 본 것이다.** 어디인지 알아야 거기에 사건을 놓거나 판을 줄인다.
    fail_if: "'없다'고 답한다."

  - id: honest-length
    ask: "10~20분이 **실측인가 추정인가.**"
    why: >-
      nan 이 세 번 덴 병이다 — 산술로 맞춰놓고 재보면 다르다.
      M2 이후로는 추정 길이를 쓰지 않는다.
    fail_if: "실제로 끝까지 돌려본 적이 없다."
    status: partial
    # **닫았다가 다시 열었다.** 이 게이트가 경고한 바로 그 일이 일어났다.
    #
    # 2026-08-06, HT-004 — 사람이 완주하고 "적당하다"고 판정. 숫자는 없었다.
    # 2026-08-06, HT-007 — "약 10분" 을 받고 **닫았다.**
    # 2026-08-07, HT-008 — 12R 고정이 판을 20% 늘린다고 **추정**해 12분 안팎이라 적었다.
    # 2026-08-07 — **다시 재보니 12R 완주에 5분이다.** 목표 10~20분의 절반이다.
    #
    # 왜 어긋났나 — "10분" 은 **처음 플레이한 사람**의 시간이었다(규칙을 읽으며 함).
    # "5분" 은 규칙을 아는 사람의 시간이다. 둘 다 진짜이고 **다른 사람의 숫자**다.
    # 나는 그 차이를 안 물어보고 하나를 실측으로 삼아 게이트를 닫았다.
    #
    # 실측 분해 (참조 플레이어 600판 + 사용자 5분) —
    #   강제 대기(연출)  78s  26%   경주 12×4.8s + 강화 8×2.55s
    #   판단·조작       222s  74%   경주당 18.5s
    #   ⇒ 경주당 약 25s. **길이는 곱셈이다.**
    #
    # 연출을 늘려 채우지 않는다 — 10분을 만들려면 연출을 5배로 해야 하고
    # 그건 `length-from-state-not-content` 가 막는 종류의 부풀리기다.
    # 동결 안에서 정직한 레버는 **경주 수(곱하는 쪽)** 하나뿐이었다.
    #
    # 2026-08-07, HT-009 — 사용자가 **20경주**를 택했다. 25초 × 20 = **약 8분(산술)**.
    # **아직 실측이 아니다.** 사람이 20경주를 완주하고 시간을 주기 전까지 안 닫는다.
    # 같은 작업에서 경제를 재측정했다 — 파산 15% · 참여율 91% · 인기마 38%.

# ── M4 동결 이후 열린 것 ─────────────────────────────────────────────────
# 2026-08-07 — **아트 방향 변경으로 M4 를 한 번 열었다.**
# M4 의 금지 범위에 "아트 방향"이 있었는데 사용자가 트랙 스프라이트 도입을 지시했다.
# 규칙·시스템·승식·스탯·페이즈는 **하나도 안 늘었다** — `freeze.test` 가 그대로 통과한다.
# 바뀐 것은 트랙에서 말을 무엇으로 그리는가뿐이다.
#   · 같은 판정에서 경주 수 8~12 랜덤 → 12 고정 (사용자 실측 10분)
#   · 창구·이름·마방·트랙 겹침 7건 수정
# 동결은 유지한다. 다음에 규칙이 바뀌면 그건 새 마일스톤이다.

# ── 받아들인 넷 — **사람이 확정했다** (2026-08-07) ─────────────────────────
# M4 에서 "고치지 않고 출하한다"로 분류했고, M5 에서 사람 동의를 받았다.
# 이제 미해결이 아니라 **설계 결정**이다. 다시 열려면 새 마일스톤이 필요하다.
#   1. 조합 승식에서 정보 우위가 희석된다 — 고치려면 새 시스템이 필요하다(M4 위반)
#   2. 강화 확률표 27개 값이 근거 없다 — 분포(행 합 100 · 감소 단조)만 검사가 지킨다
#   3. 공제율 20% — 실제 경마 범위 안이라 바꿀 근거가 없다
#   4. 상금이 CON-001 원안에 없던 것 — 2차 승인으로 닫혔다
#
# 같은 날 닫힌 것 — 유리 카드 대비는 "구분된다"로 **그대로 둔다.**

# ── 쇼츠각 — nan 에서 이어받되 긴 게임 기준으로 ─────────────────────────────
# 사용자 상시 요청: 게임 설계는 매번 쇼츠각 4항목으로 평가한다.
# 다만 긴 게임은 **판 전체가 클립이 아니라 판 안의 한 순간이 클립**이다.
shortsCheck:
  - id: punchline-frame
    note: "한 프레임에 인과가 담기는가. **긴 게임은 여기가 더 어렵다** — 맥락이 클립 밖에 있다."
  - id: clip-varies
    note: "매판 다른 클립이 나오는가. **긴 게임은 여기가 더 쉽다** — 상태가 쌓이므로 상황이 갈린다."
  - id: blame-rotates
    note: "누구 탓인지가 화면에 남고 매판 바뀌는가."
  - id: payoff-not-a-number
    note: "페이오프가 숫자가 아니라 그림인가. 10분을 버틴 뒤라면 더 세야 한다."
