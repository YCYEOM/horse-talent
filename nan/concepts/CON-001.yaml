approvedBy: yeomyooncheol
notes: |
  ## 사용자가 정한 것 (2026-08-06, 2차)

  1. **1인 게임**으로 확정.
  2. 말 그림을 **더 말답게** — 1차 컨셉의 타원 두 개는 약했다.
  3. **강화 결과 3갈래** — 성공 / 실패-능력치 보존 / 실패-능력치 감소.
     **각 확률을 화면에 표기**하고, **단계가 오를수록 감소 확률이 오른다.**
  4. **경주 수 12회 고정.** (원안 8~12 랜덤 — HT-007 에서 사용자가 고정을 택했다)
  5. **능력치 여러 개**(속력·가속·체력), **강화 최대 10단계.**
  6. **베팅 구조는 실제 경마와 동일.**
  7. **아트는 메이플스토리처럼 귀엽고 캐릭터성 있게.**

  1차에서 결정된 것(강화 결과는 사적 정보 · 동사는 "건다" 하나 · 국면 셋)은 그대로다.

  ## 강화 — 세 갈래와 확률표

  강화는 **능력치 하나를 골라** 시도한다. 최대 10단계.

  | 단계 | 성공 | 실패·보존 | 실패·**감소** |
  |---|---|---|---|
  | 1 → 2 | 95% | 5% | — |
  | 2 → 3 | 88% | 12% | — |
  | 3 → 4 | 78% | 20% | 2% |
  | 4 → 5 | 68% | 26% | 6% |
  | 5 → 6 | 58% | 30% | 12% |
  | 6 → 7 | 48% | 33% | 19% |
  | 7 → 8 | 38% | 35% | 27% |
  | 8 → 9 | 30% | 34% | 36% |
  | 9 → 10 | 22% | 33% | 45% |

  - 각 행의 합은 100 이다. **화면에 세 숫자를 다 적는다** — 사용자 요청이고,
    숨기면 이 게임의 판단 재료가 사라진다.
  - **1~2단계에는 감소가 없다.** 초반에 말이 망가지면 시작도 못 한다.
  - 감소는 **한 단계**만 내려간다(0 미만으로 안 간다).
  - **전부 근거 없이 고른 값이다.** 시뮬레이션으로 다시 잰다.

  **왜 세 갈래인가.** 두 갈래(성공/실패)면 실패가 곧 재앙이라 8단계 이후로
  아무도 안 누른다. 보존이 끼면 **"기대값은 나쁘지만 최악은 아닌"** 구간이 생기고,
  그래서 9단계에서 손이 떨리는 결정이 된다.

  ## 능력치 셋 — 강화 대상이 곧 판단이다

  | 능력치 | 하는 일 | 언제 중요한가 |
  |---|---|---|
  | **속력** | 최고 속도 | 직선이 긴 코스 · 중거리 |
  | **가속** | 출발과 코너 탈출 | **단거리**(1000~1200m) |
  | **체력** | 후반 유지 — 없으면 마지막 직선에서 잡힌다 | **장거리**(1800~2000m) |

  **경주마다 거리가 다르다.** 다음 경주가 단거리면 가속을, 장거리면 체력을 올려야 한다.
  강화가 "무조건 센 걸 올린다"가 아니라 **다음 경주를 보고 고르는 일**이 된다 —
  이것이 강화와 예측을 한 번 더 묶는다.

  3스탯 × 10단계 = 최대 30회 강화지만 한 판에 12회밖에 못 한다.
  **다 못 채우는 것이 의도다** — 어디에 몰아줄지가 결정이다.

  ## 베팅 — 실제 경마 그대로 (패리뮤추얼)

  ### 승식 7종

  | 승식 | 맞혀야 하는 것 | 난이도 |
  |---|---|---|
  | 단승 | 1착 | 쉬움 |
  | 연승 | 지정 말이 3착 이내 | 가장 쉬움 |
  | 복승 | 1·2착 조합 (순서 무관) | 중간 |
  | 쌍승 | 1·2착 (순서까지) | 어려움 |
  | 복연승 | 지정 두 마리가 3착 이내 | 중간 |
  | 삼복승 | 1·2·3착 조합 (순서 무관) | 어려움 |
  | 삼쌍승 | 1·2·3착 (순서까지) | 가장 어려움 |

  ### 배당이 어떻게 나오는가 — 확률의 역수가 아니다

  **패리뮤추얼**: 승식별 판돈을 모아 **공제율**을 빼고 적중자끼리 나눈다.

      배당 = (그 승식 총 판돈 × (1 − 공제율)) ÷ 적중 판돈

  여기서 두 가지가 따라 나오고, **둘 다 게임을 좋게 만든다.**

  1. **배당은 대중의 예상이지 진실이 아니다.** 그래서 강화 결과를 나만 아는 것이 값이 된다.
     이 컨셉의 핵심이 실제 경마 규칙에서 그대로 나온다.
  2. **내가 크게 걸면 내 배당이 내려간다.** 전 재산을 한 곳에 밀어 넣으면 스스로 배당을
     깎는다 — 규칙을 더 만들지 않고 "몰빵"에 제동이 걸린다. 실제 경마의 성질이다.

  공제율은 20% 로 시작한다(실제는 승식마다 다르다). **화면에 표기한다.**

  ### 승식이 곧 국면이다

  낮은 배당에서 벌려면 어려운 승식으로 가야 한다. 그래서 **승식 선택이
  `projectGates.curve-not-repetition` 의 답이 된다** — 후반이 초반의 반복이 아닌 이유가
  실제 경마 구조에서 나온다.

  | 국면 | 주로 쓰는 승식 | 판단 |
  |---|---|---|
  | 초반 1~3R | 연승 · 단승 | 시드 만들기. 내 말은 아직 약해서 남의 말만 본다 |
  | 중반 4~8R | 단승 · 복승 | 강화냐 베팅이냐. 골드 배분 |
  | 후반 9~12R | 삼복승 · 삼쌍승 | 내 말 배당이 낮아 조합으로만 크게 번다 |

  ## 규모

  | | 값 |
  |---|---|
  | 경주 수 | **12회 고정** (원안은 8~12 랜덤. HT-007 에서 사용자 실측 10분 뒤 고정으로 바꿨다 — 몰빵 방어를 잃는 대신 길이가 일정해진다) |
  | 출주 두수 | 6~8두 (연승이 3착 이내로 성립하려면 최소 5두) |
  | 거리 | 1000 / 1200 / 1400 / 1600 / 1800 / 2000m |
  | 강화 단계 | 능력치별 **최대 10** |
  | 능력치 | 속력 · 가속 · 체력 |
  | 한 사이클 | 1.5~2분 → **12~20분** (추정. M2 에서 실측) |

  ## 아트 — 메이플스토리 계열

  사용자 지정. 1차의 배당판 리얼리즘(야간 잔디 · LED)에서 **방향을 바꾼다.**

  - **2~3등신 치비 말.** 큰 머리 · 큰 눈 · 짧은 다리 · 통통한 몸.
  - **굵은 어두운 외곽선 + 납작한 채색.** 그라데이션 최소.
  - **밝고 채도 높은 색.** 말마다 색이 다르고 **내 말은 표정이 있다.**
  - **통통 튀는 모션** — 달릴 때 몸이 위아래로, 갈기와 꼬리가 늦게 따라온다.
  - UI 는 둥근 나무·금속 프레임, 큰 버튼, 반짝임.

  **다만 판독성이 먼저다**(DESIGN.md Purpose). 귀여움이 숫자를 가리면 안 된다 —
  배당·확률·골드는 이 게임의 판단 재료다. 캐릭터는 트랙과 마방에, 숫자는 UI 층에 둔다.

  ## 하드게이트

  - **theme-is-mechanic** ✓ 강해졌다 — **패리뮤추얼**이 컨셉의 핵심을 직접 만든다.
    경마를 빼고 고정 배당으로 바꾸면 정보 비대칭도 몰빵 제동도 사라진다.
  - **one-sentence-playable-loop** ✓ "골드를 어디에 걸지 정한다"
  - **representative-scene** ✓ 7R 장면. **7경주째에 나온다**
  - **vertical-slice-in-six-hours** ✓ 첫 3분 = 경주 2회 + 강화 1회 + 단승/연승만.
    **승식 7종을 다 넣지 않는다** — 첫 조각은 2종이다
  - **maximum-two-new-core-systems** ✓ `race`(경주 시뮬 + 패리뮤추얼 배당 + 승식 정산)
    · `stable`(3스탯 × 10단계 강화 확률).
    **이 게이트가 이 컨셉에서 가장 아슬아슬하다** — 승식 7종 정산이 `race` 안에서 크다.
    안 들면 승식을 줄인다(늘리지 않는다)
  - **visible-player-feedback** ✓ 확률 3종·배당·골드가 전부 화면에
  - **shippable-evidence** ✓

  ## projectGates

  - **curve-not-repetition** ✓ 승식이 국면을 만든다(위 표). 구조에서 나온다
  - **decisions-bind** ✓ 강화는 되돌릴 수 없고, 감소하면 회복 수단이 재강화뿐이다.
    어느 스탯에 몰아줬는지가 남은 경주 거리와 계속 부딪힌다
  - **length-from-state-not-content** ✓ 스탯 3 × 단계 10 × 골드 × 배당이 상태다.
    말 이름·색은 절차 생성 — **수작업 콘텐츠 0**
  - **quit-point-known** ⚠ **중반.** 강화 감소가 연달아 나오면 복구 불가로 보인다.
    대책은 **연승(3착 이내)이 항상 열려 있다는 것** — 약한 말도 3착은 가능하고
    배당이 낮아도 꾸준하다. 실제 경마 승식이 안전망 역할을 한다
  - **honest-length** ✗ **아직 추정이다.** M2 에서 실측한다

  ## 쇼츠각

  1. **punchline 프레임** ✓ 강화가 세 갈래 중 하나로 멈추는 순간. **"감소"가 가장 세다**
  2. **매판 다른 클립** ✓ 경주 수·거리·스탯 배분이 매판 다르다
  3. **범인 로테이션** ✗ **1인이라 범인이 나뿐이다.** 사용자가 1인으로 확정했으므로
     이 항목은 **포기한 것**으로 기록한다. 대신 말 이름이 그 자리를 메운다 —
     `그린라이트 12.6배 3착`
  4. **숫자 아닌 페이오프** △ 골드가 숫자다. 정산을 **마권이 찢어지는/쌓이는 그림**으로 갚는다

  ## 점수 (합계 90 / 100)

  - **theme 23/25** (+1) — 패리뮤추얼이 결합을 강화했다
  - **playability 21/25** — 동사 하나 유지. 스탯 선택이 붙었지만 조작은 안 늘었다
  - **arc 17/20** (+1) — 승식이 국면을 구조적으로 만든다
  - **novelty 11/15** — 경마 육성·베팅은 흔하다. 드문 것은 **강화가 사적 정보라는 것**
  - **feasibility 10/15** (−2) — 승식 7종 · 패리뮤추얼 · 3스탯 · 10단계 · 치비 아트.
    **1차보다 확실히 커졌다.** 신규 시스템 2개 상한이 꽉 찼다
  - **visualClarity 8/10** (−1) — 귀여운 아트와 숫자 판독성이 같은 화면에서 싸운다

  ## 미해결

  - 강화 확률표 9행 27개 값 — 시뮬레이션으로 재조정
  - 공제율 20% 와 가상 관중의 베팅 분포 모델
  - 경주 시뮬이 스탯 셋을 어떻게 쓰는가(거리별 가중치)
  - 승식 7종이 6시간 조각에 다 드는가 — **안 들면 줄인다**
  - 치비 말이 6~8두 동시에 화면에서 구분되는가

  ## ⚠ 실측이 반박한 것 (2026-08-06, M2·M3) — **재승인 필요**

  승인 뒤 구현·측정에서 이 문서의 두 문장이 틀렸다는 것이 드러났다.
  조용히 코드만 맞추면 문서가 거짓말이 되므로 여기 적고 **다시 승인을 받는다.**

  ### 1. "후반엔 삼복승·삼쌍승으로 크게 번다" — **틀렸다**

  조합 승식은 내 말 말고 **다른 말들의 착순도** 맞혀야 하는데 거기엔 정보 우위가 없다.
  후반 실측: 삼복승 −49% · 삼쌍승 −68%. 최선은 여전히 **단승(+29%)** 이다.

  ### 2. 수입원을 안 적었다 — **상금이 빠져 있었다**

  이 문서는 "순위를 맞히면 골드"만 적었다. 그런데 베팅은 공제율 때문에
  **모든 승식이 −EV** 라, 정책 넷을 12경주 × 400판 돌리니 **넷 다 졌다**
  (안 거는 전략조차 0.19배). **수입원이 없었다.**

  실제 경마에서 마주는 베팅이 아니라 **상금**으로 번다. 상금을 넣자 게임이 성립했다
  (HT-004). 두 수입원의 성격이 다른 것이 오히려 낫다 —
  **상금은 강화의 직접 보상**(확실·작다), **베팅은 정보 우위의 레버리지**(위험·크다).

  ### 곡선은 있다 — 다만 문서가 말한 모양이 아니다 (M3 실측)

  | 국면 | 최선의 수 | 근거 |
  |---|---|---|
  | 초반 | **안 건다.** 강화에 넣고 상금으로 버틴다 | 전 승식 −41% 이하. 우위가 0 이다 |
  | 중반 | **내 말 단승** | 강화는 쌓였는데 평판이 못 따라온다. +96% |
  | **강화 감소 시** | **남의 말(인기마) 단승** | 관중이 내 말을 과대평가하면 인기마가 싸진다. +45% |
  | 후반 | **상금 극대화 — 강화 배분** | 상금(1,862 G)이 베팅 우위를 압도한다. 같은 총 스탯 27 도 배분에 따라 382~3,939 G. 다만 **상금 곡선 자체는 소폭 상승(1.25배)** 이라 국면 차이는 크기가 아니라 입상률에서 나온다 |

  **역베팅은 이 문서에 없던 수다.** 정보 비대칭이 양방향으로 작동한다는 뜻이고,
  컨셉의 핵심을 오히려 강화한다 — 우위는 "내 말이 세다"가 아니라
  **"관중이 틀렸다"** 에서 나온다.

  ## 승인

  **2026-08-06, yeomyooncheol 승인.** 사용자가 본 것은 2차 컨셉 렌더다 —
  치비 말 4종(기본·성공·감소·상대), 트랙 6두, 강화 3갈래 게이지 연출,
  9행 확률표, 승식 7종 표, 패리뮤추얼 계산 그림, 국면 3단 표.

  **승인이 수치를 검증했다는 뜻이 아니다.** 확률표 27개 값, 공제율 20%,
  관중 판돈 분포, 스탯의 거리별 가중치, 경주 수, 화면 규격은
  전부 작업 명세에서 정하고 플레이테스트에서 조정한다.

  승인 시점에 **명시적으로 포기한 것**: 쇼츠각 3번(범인 로테이션) — 1인 게임이라
  범인이 나뿐이다.

  **2차 승인 (2026-08-06, yeomyooncheol).** 위 "실측이 반박한 것" 절을 포함해 승인했다.

  사용자가 본 것: 삼쌍승 −68% 실측, 정책 4종이 전부 진 결과(안 거는 전략조차 0.19배),
  상금 신설의 근거와 효과, 국면 4종 실측표(초반 안 건다 / 중반 내 말 / 감소 시 역베팅 /
  후반 상금 극대화), 역베팅 수치(실제 5·평판 8 에서 인기마 +45%).

  이어서 사용자가 지정한 것: **상금 곡선을 소폭 상승으로**(2.15배 → 1.25배),
  **대상경주 신설**(마지막 1회 · 3배 · 거리 사전 공개), **능력치 5종**.
  그 셋은 HT-006 에 반영됐고 이 문서의 국면표가 그 결과다.

  **승인 문구는 "정리하고 m4 진행해줘" 였다** — 열려 있던 재승인 건을 닫으라는 뜻으로 받았다.
  수치를 검증했다는 뜻이 아니다.
