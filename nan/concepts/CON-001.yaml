id: CON-001
title: 경마 — 내가 아는 것과 배당이 아는 것의 차이
summary: >-
  1인 게임. 골드를 **어디에 걸지**만 정한다 — 남의 말에 걸거나, 내 말에 걸거나,
  내 말의 능력치 강화에 건다. 셋 다 같은 동사·같은 자원·다른 위험이다.
  **강화 결과는 나만 안다.** 배당은 실제 경마와 같은 패리뮤추얼이라
  대중의 예상일 뿐이고, 내가 아는 것과 그 차이가 곧 돈이 된다.
tags: [race, betting, pari-mutuel, enhancement, single-player, 10-20min, web, 2d, cute]
axes:
  space: >-
    한 경주장. 사이클마다 세 자리를 돈다 — **마방**(능력치 강화) → **창구**(승식 베팅)
    → **트랙**(경주). 자리가 셋이어도 조작은 하나라 배우는 것은 안 늘어난다
  coreVerb: >-
    bet — **건다. 그거 하나다.** 남의 말에 거는 것이 예측, 내 말에 거는 것이 자신감,
    강화에 거는 것이 육성이다. 국면마다 같은 동사의 뜻만 바뀐다
  systemBehavior: >-
    pari-mutuel — **배당이 확률이 아니라 판돈에서 나온다.** 실제 경마 그대로다.
    총 판돈에서 공제율을 빼고 적중자끼리 나누므로 배당은 **대중의 예상**이지 진실이 아니고,
    **내가 크게 걸면 내 배당이 내려간다.** 강화 결과는 대중이 모르므로 그 차이가 값이 된다
  pressure: >-
    상대 말이 경주마다 세진다 + 강화 단계마다 성공률이 떨어지고 **능력치 감소 확률이 오른다**
    + 내 말이 강해질수록 배당이 낮아져 같은 돈을 벌기 어렵다
  themeCoupling: >-
    **패리뮤추얼이 있어야 성립한다.** 배당이 대중의 판돈에서 나오기 때문에
    "내가 아는 것 ≠ 시장이 아는 것"이 돈이 되고, 크게 걸면 내 배당이 깎이는 자기 제약도 생긴다.
    경마를 빼고 고정 배당으로 바꾸면 둘 다 사라지고 남는 것은 확률에 돈 거는 슬롯이다
  visualReward: >-
    강화 판정이 세 갈래 중 하나로 멈추는 순간, 그리고 **마지막 직선에서 내 말이
    배당판을 배신하는 순간** — 12.6배가 3착으로 들어와 삼복승이 맞는 그림
representativeScene: >-
  7R, 1600m 장거리. 내 말 그린라이트는 속력 6 · 가속 4 · 체력 3 이다.
  장거리라 체력이 중요한데 3이라 부족하다. 체력 4단계 강화는 성공 68% · 보존 26% · **감소 6%**.
  누른다 — **보존.** 골드만 날아갔고 능력치는 그대로다. 대중은 강화를 시도한 것조차 모르니
  배당도 그대로 8.4배. 남은 골드를 내 말의 **연승**(3착 이내)에 건다.
  체력이 모자란 그린라이트가 마지막 직선에서 두 마리에게 잡히고 **3착으로 들어온다.**
